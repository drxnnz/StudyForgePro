<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyForge - AI Study Companion</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            750: '#293548',
                        }
                    },
                    maxWidth: {
                        'app-wide': '1400px',
                        'app-detail': '1200px',
                        'app-study': '900px',
                        'app-narrow': '720px'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar and utilities to match prototype feel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.8);
        }
        /* Markdown/Editor placeholder color */
        textarea::placeholder {
            color: #94a3b8;
        }
        .dark textarea::placeholder {
            color: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white transition-colors duration-300">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center pointer-events-none">
        <div id="modal-backdrop" class="absolute inset-0 bg-slate-900/40 dark:bg-slate-950/60 backdrop-blur-sm opacity-0 transition-opacity duration-300 pointer-events-auto"></div>
        <div id="modal-content" class="relative z-10 w-full max-w-lg scale-95 opacity-0 transition-all duration-300 pointer-events-auto max-h-[90vh] overflow-y-auto"></div>
    </div>

    <!-- App Root Layout -->
    <div id="app" class="flex h-[100dvh] w-full overflow-hidden">
        <!-- Application shell will be injected here -->
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- MOCK DATA ---
        const MOCK_DATA = [
            {
                id: 'set_1',
                title: 'Philippine History: Pre-Colonial to Spanish Era',
                subject: 'History',
                documentName: 'PH_History_101.pdf',
                progress: 45,
                totalQuestions: 25,
                estimatedTime: '30 min',
                lastStudied: '2 hours ago',
                topics: ['Pre-Colonial Society', 'Arrival of Magellan', 'Spanish Colonization', 'Galleon Trade'],
                lessons: [
                    {
                        id: 'l1',
                        title: 'Pre-Colonial Period',
                        expanded: false,
                        questions: [
                            {
                                id: 'q1',
                                type: 'mcq',
                                prompt: 'What was the system of writing used by early Filipinos before the arrival of the Spanish?',
                                choices: ['Alibata', 'Baybayin', 'Sanskrit', 'Cyrillic'],
                                correctAnswer: 1,
                                explanation: 'Baybayin is the pre-colonial ancient writing script of the Philippines. Alibata is a misnomer coined in the early 20th century.',
                                mastery: 'needs-review',
                                hints: ['It starts with a B.', 'It is often confused with Alibata.'],
                                tags: ['culture', 'pre-colonial']
                            },
                            {
                                id: 'q3',
                                type: 'tf',
                                prompt: 'The Barangay was the basic socio-political unit in the pre-colonial Philippines.',
                                choices: ['True', 'False'],
                                correctAnswer: 0,
                                explanation: 'The Barangay consisted of 30 to 100 families led by a Datu.',
                                mastery: 'mastered',
                                hints: [],
                                tags: ['politics']
                            }
                        ]
                    },
                    {
                        id: 'l2',
                        title: 'Spanish Era',
                        expanded: true,
                        questions: [
                            {
                                id: 'q2',
                                type: 'mcq',
                                prompt: 'Who was the Portuguese explorer who led the Spanish expedition that arrived in the Philippines in 1521?',
                                choices: ['Miguel López de Legazpi', 'Ferdinand Magellan', 'Christopher Columbus', 'Ruy López de Villalobos'],
                                correctAnswer: 1,
                                explanation: 'Ferdinand Magellan arrived in Homonhon in 1521, marking the beginning of Spanish influence.',
                                mastery: 'needs-review',
                                hints: ['He died in Mactan.'],
                                tags: ['exploration']
                            },
                            {
                                id: 'q6',
                                type: 'type',
                                prompt: 'Name the trade system connecting Manila and Acapulco during the Spanish colonial period.',
                                choices: [],
                                correctAnswer: 'Galleon Trade',
                                explanation: 'The Manila-Acapulco Galleon Trade was the main source of income for the colony during its early years.',
                                mastery: 'learning',
                                hints: ['It involves a type of large ship.'],
                                tags: ['economics']
                            }
                        ]
                    }
                ]
            },
            {
                id: 'set_2',
                title: 'Introduction to Computing (Java & Linux Basics)',
                subject: 'Computer Science',
                documentName: 'CS101_Midterms.docx',
                progress: 0,
                totalQuestions: 40,
                estimatedTime: '45 min',
                lastStudied: 'Never',
                topics: ['Hardware Components', 'Linux File System', 'Java Basics', 'Object-Oriented Concepts'],
                lessons: [
                    {
                        id: 'l3',
                        title: 'Linux Basics',
                        expanded: true,
                        questions: [
                            {
                                id: 'q4',
                                type: 'flashcard',
                                prompt: 'Command to change directory in Linux',
                                choices: [],
                                correctAnswer: 'cd',
                                explanation: 'The "cd" (change directory) command navigates the file system.',
                                mastery: 'learning',
                                hints: [],
                                tags: ['commands']
                            }
                        ]
                    }
                ]
            }
        ];

        const MOCK_TRASH = [
            {
                id: 'trash_1',
                title: 'Biology 101: Cell Structure',
                totalQuestions: 50,
                deletedDate: '2 days ago'
            }
        ];

        // --- CSS STYLING CONSTANTS ---
        const clayCardClass = "bg-white dark:bg-slate-800 rounded-2xl shadow-[inset_0_2px_4px_rgba(255,255,255,0.8),0_4px_12px_rgba(15,23,42,0.04)] dark:shadow-[inset_0_1px_2px_rgba(255,255,255,0.05),0_4px_12px_rgba(0,0,0,0.3)] border border-slate-100/50 dark:border-slate-700/50 transition-all duration-300";
        const buttonBaseClass = "inline-flex items-center justify-center font-medium transition-all duration-200 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900";
        const primaryButtonClass = `${buttonBaseClass} bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-[inset_0_1px_1px_rgba(255,255,255,0.3),0_2px_4px_rgba(79,70,229,0.3)] min-h-[44px] min-w-[44px] px-4 py-2.5`;
        const secondaryButtonClass = `${buttonBaseClass} ${clayCardClass} hover:bg-slate-50 dark:hover:bg-slate-750 text-slate-700 dark:text-slate-200 min-h-[44px] min-w-[44px] px-4 py-2.5`;
        const dangerButtonClass = `${buttonBaseClass} bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/50 rounded-xl min-h-[44px] px-4 py-2.5`;
        const inputClass = "w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900 dark:text-white placeholder-slate-400";

        // --- APPLICATION STATE ---
        const state = {
            theme: 'light',
            view: 'home',
            createMethod: null, // null = selection screen, 'manual', 'txt', 'ai'
            studySets: MOCK_DATA,
            trashSets: MOCK_TRASH,
            activeSetId: null,
            sessionConfig: { mode: 'mcq', count: 'all', speedrun: false, time: '5m' },
            sessionState: { currentQ: 0, answers: [], score: 0, mode: 'mcq', revealed: false },
            sidebarExpanded: true,
            activeDropdown: null,
            activeModal: null, 
            modalData: null,
            filterReview: 'all', 
            selectedFile: null
        };

        const VIEW_ORDER = {
            'home': 0, 'library': 1, 'trash': 2, 'help': 3, 
            'create': 4, 'processing': 5, 'generated-preview': 6, 
            'detail': 7, 'session-config': 8, 'study': 9, 'results': 10
        };

        let isTransitioning = false;

        // --- ICON HELPERS (SVG) ---
        function renderLogo(className = "w-8 h-8") {
            return `
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="${className}">
                    <path d="M20 80 L50 20 L80 80 Z" class="fill-indigo-500/25 dark:fill-indigo-500/30 stroke-indigo-600 dark:stroke-indigo-400" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M50 20 L50 80" class="stroke-indigo-600 dark:stroke-indigo-400" stroke-width="6" stroke-linecap="round"/>
                    <path d="M35 50 L65 50" class="stroke-indigo-600 dark:stroke-indigo-400" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="50" cy="20" r="4" class="fill-indigo-600 dark:fill-indigo-400"/>
                </svg>
            `;
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('studyforge-theme');
            if (savedTheme) {
                state.theme = savedTheme;
                document.documentElement.classList.toggle('dark', savedTheme === 'dark');
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                state.theme = 'dark';
                document.documentElement.classList.add('dark');
            }
            
            initApp();
            setupEventDelegation();
        });

        function initApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div id="sidebar-container" class="hidden lg:flex flex-col h-full z-20 shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transition-all duration-300"></div>
                <div class="flex-1 flex flex-col min-w-0 h-full relative">
                    <div id="mobile-header-container" class="lg:hidden shrink-0 z-20 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800"></div>
                    <div class="hidden lg:flex pointer-events-none absolute inset-x-0 top-0 z-30 px-6 sm:px-10 lg:px-12 pt-8">
                        <div class="max-w-[1400px] mx-auto w-full flex justify-end">
                            <div id="desktop-theme-container" class="pointer-events-auto"></div>
                        </div>
                    </div>
                    <main id="page-stage" class="flex-1 relative overflow-hidden bg-slate-50 dark:bg-slate-950 transition-colors duration-300"></main>
                    <div id="mobile-nav-container" class="lg:hidden shrink-0 z-20 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800"></div>
                </div>
            `;
            
            renderShell();
            
            const stage = document.getElementById('page-stage');
            const page = document.createElement('div');
            page.className = `page-container active absolute inset-0 overflow-y-auto w-full h-full px-4 sm:px-8 md:px-10 lg:px-12 py-6 sm:py-8 lg:py-12 flex flex-col z-10`;
            page.innerHTML = `<div class="max-w-[1400px] mx-auto pb-16 flex-1 w-full" id="page-content">${renderCurrentView()}</div>`;
            stage.appendChild(page);
        }

        // --- CORE NAVIGATION & TRANSITIONS ---
        function navigate(newView, id = null, scrollToSection = null) {
            if (isTransitioning) return;
            if (id) state.activeSetId = id;
            state.activeDropdown = null;
            
            if (newView === 'create') {
                state.createMethod = null;
            }

            const oldView = state.view;
            if (oldView === newView) {
                renderPage(); 
                if(scrollToSection) document.getElementById(scrollToSection)?.scrollIntoView({behavior: 'smooth'});
                return;
            }

            const oldOrder = VIEW_ORDER[oldView] || 0;
            const newOrder = VIEW_ORDER[newView] || 0;
            let direction = newOrder >= oldOrder ? 'forward' : 'backward';
            
            if (oldView === 'results' && newView === 'library') direction = 'backward';
            if (oldView === 'study' && (newView === 'detail' || newView === 'library')) direction = 'backward';
            
            state.view = newView;
            renderShell();
            transitionToView(direction, scrollToSection);
        }

        function transitionToView(direction, scrollToSection) {
            isTransitioning = true;
            const stage = document.getElementById('page-stage');
            const oldPage = stage.querySelector('.page-container.active');
            
            const newPage = document.createElement('div');
            newPage.className = `page-container absolute inset-0 overflow-y-auto w-full h-full px-4 sm:px-8 md:px-10 lg:px-12 py-6 sm:py-8 lg:py-12 flex flex-col z-20 bg-slate-50 dark:bg-slate-950`;
            newPage.innerHTML = `<div class="max-w-[1400px] mx-auto pb-16 flex-1 w-full" id="page-content">${renderCurrentView()}</div>`;
            
            stage.appendChild(newPage);
            
            const isDesktop = window.innerWidth >= 1024; 
            const axis = isDesktop ? 'Y' : 'X';
            const startOffset = direction === 'forward' ? '100%' : '-100%';
            const endOffsetOld = direction === 'forward' ? '-100%' : '100%';
            
            newPage.style.transform = `translate${axis}(${startOffset})`;
            newPage.style.opacity = '0.9';
            void newPage.offsetWidth; 
            
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const duration = prefersReducedMotion ? 0 : 350;
            const easing = 'cubic-bezier(0.25, 1, 0.4, 1)'; 
            
            if (oldPage) {
                oldPage.style.transition = `transform ${duration}ms ${easing}, opacity ${duration}ms ease`;
                oldPage.style.transform = `translate${axis}(${endOffsetOld})`;
                oldPage.style.opacity = '0.5';
                oldPage.style.pointerEvents = 'none'; 
            }
            
            newPage.style.transition = `transform ${duration}ms ${easing}, opacity ${duration}ms ease`;
            newPage.style.transform = `translate${axis}(0)`;
            newPage.style.opacity = '1';
            
            newPage.classList.add('active');
            if (oldPage) oldPage.parentNode.removeChild(oldPage);
            
            setTimeout(() => {
                if (oldPage && oldPage.parentNode) oldPage.parentNode.removeChild(oldPage);
                newPage.style.transition = '';
                newPage.style.transform = '';
                isTransitioning = false;
                if(scrollToSection) {
                    const el = document.getElementById(scrollToSection);
                    if(el) el.scrollIntoView({behavior: 'smooth'});
                }
            }, duration);
        }

        function renderPage() {
            const content = document.getElementById('page-content');
            if (content) content.innerHTML = renderCurrentView();
        }

        function renderShell() {
            const sidebarBtn = document.getElementById('sidebar-container');
            if (sidebarBtn) {
                const expanded = state.sidebarExpanded;
                sidebarBtn.className = `hidden lg:flex flex-col h-full z-20 shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transition-all duration-300 ${expanded ? 'w-64' : 'w-20'}`;
                sidebarBtn.innerHTML = renderSidebarContent(expanded);
            }
            
            const mobHeader = document.getElementById('mobile-header-container');
            if (mobHeader) mobHeader.innerHTML = renderHeader();
            const mobNav = document.getElementById('mobile-nav-container');
            if (mobNav) mobNav.innerHTML = renderMobileNav();
            const desktopThemeContainer = document.getElementById('desktop-theme-container');
            if (desktopThemeContainer) {
                desktopThemeContainer.innerHTML = `
                    <button data-action="toggle-theme" class="flex items-center justify-center p-3 rounded-xl border border-slate-200 dark:border-slate-700/80 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shadow-md bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm min-h-[44px] min-w-[44px]" title="Toggle Theme">
                        ${state.theme === 'dark' ? 
                        '<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>' : 
                        '<svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>'}
                    </button>`;
            }
        }

        // --- COMPONENTS & UTILS ---
        function renderEmptyState(icon, title, desc, actionHtml = '') {
            return `
                <div class="flex flex-col items-center justify-center py-16 px-4 text-center">
                    <div class="w-20 h-20 rounded-full bg-slate-100 dark:bg-slate-800/50 flex items-center justify-center mb-6 text-slate-400 dark:text-slate-500">
                        ${icon}
                    </div>
                    <h3 class="text-xl font-semibold text-slate-900 dark:text-white mb-2">${title}</h3>
                    <p class="text-slate-500 dark:text-slate-400 max-w-sm mb-8">${desc}</p>
                    ${actionHtml}
                </div>
            `;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toastEl = document.createElement('div');
            const bgClass = type === 'info' ? 'bg-indigo-600 text-white' : (type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-900 dark:bg-slate-800 text-white border border-slate-700');
            toastEl.className = `${bgClass} px-4 py-3 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 opacity-0 translate-y-2 pointer-events-auto flex items-center justify-between`;
            toastEl.innerHTML = `<span>${message}</span>`;
            container.appendChild(toastEl);
            
            setTimeout(() => toastEl.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toastEl.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toastEl.remove(), 300);
            }, 3000);
        }

        function openModal(modalName, data = null) {
            state.activeModal = modalName;
            state.modalData = data;
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            const backdrop = document.getElementById('modal-backdrop');
            
            content.innerHTML = renderModalContent(modalName);
            container.classList.remove('hidden');
            container.classList.add('flex');
            
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            const backdrop = document.getElementById('modal-backdrop');
            
            backdrop.classList.add('opacity-0');
            content.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                container.classList.add('hidden');
                container.classList.remove('flex');
                state.activeModal = null;
                state.modalData = null;
            }, 300);
        }

        function renderModalContent(modalName) {
            if (modalName === 'editQuestion') {
                return `
                    <div class="${clayCardClass} p-6 space-y-4">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Edit Question</h3>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Question / Front</label>
                            <textarea rows="2" class="${inputClass}">What was the system of writing used by early Filipinos?</textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Answer / Back</label>
                            <input type="text" value="Baybayin" class="${inputClass}" />
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button data-action="close-modal" class="${secondaryButtonClass}">Cancel</button>
                            <button data-action="close-modal" class="${primaryButtonClass}">Save Changes</button>
                        </div>
                    </div>
                `;
            } else if (modalName === 'deleteConfirm') {
                return `
                    <div class="${clayCardClass} p-6 space-y-4 text-center">
                        <div class="w-12 h-12 rounded-full bg-red-50 dark:bg-red-900/30 text-red-600 flex items-center justify-center mx-auto">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Delete Item?</h3>
                        <p class="text-sm text-slate-500">This action cannot be undone.</p>
                        <div class="flex justify-center gap-3 pt-2">
                            <button data-action="close-modal" class="${secondaryButtonClass}">Cancel</button>
                            <button data-action="close-modal" class="${dangerButtonClass}">Delete</button>
                        </div>
                    </div>
                `;
            } else if (modalName === 'generationOptions') {
                return `
                    <div class="${clayCardClass} p-6 space-y-4">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Generation Options</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Question Count</label>
                                <select class="${inputClass}">
                                    <option>25 Questions (Recommended)</option>
                                    <option>10 Questions</option>
                                    <option>50 Questions</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Focus Types</label>
                                <div class="space-y-2 mt-1">
                                    <label class="flex items-center text-sm text-slate-700 dark:text-slate-300"><input type="checkbox" checked class="mr-2 rounded text-indigo-600"> Multiple Choice</label>
                                    <label class="flex items-center text-sm text-slate-700 dark:text-slate-300"><input type="checkbox" checked class="mr-2 rounded text-indigo-600"> True / False</label>
                                    <label class="flex items-center text-sm text-slate-700 dark:text-slate-300"><input type="checkbox" checked class="mr-2 rounded text-indigo-600"> Flashcards</label>
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button data-action="close-modal" class="${primaryButtonClass}">Apply Options</button>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        // --- SHELL COMPONENTS ---
        function renderSidebarContent(expanded) {
            return `
                <div class="p-5 flex items-center ${expanded ? 'justify-between' : 'justify-center'} border-b border-slate-100 dark:border-slate-800/60 relative">
                    <div class="flex items-center space-x-3 cursor-pointer overflow-hidden" data-nav="home">
                        <div class="flex-shrink-0">${renderLogo("w-8 h-8")}</div>
                        <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white transition-opacity duration-200 ${expanded ? 'opacity-100' : 'opacity-0 w-0 hidden'}">StudyForge</span>
                    </div>
                    ${expanded ? `
                        <button data-action="toggle-sidebar" class="p-2 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors min-h-[44px] min-w-[44px] flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                        </button>` : `
                        <button data-action="toggle-sidebar" class="absolute inset-0 w-full h-full flex items-center justify-center bg-white/80 dark:bg-slate-900/80 opacity-0 hover:opacity-100 transition-opacity">

                            <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>

        }

        function renderLessonSection(lesson) {
            let qs = lesson.questions;
            if (state.filterReview !== 'all') qs = qs.filter(q => q.mastery === state.filterReview);
            if (qs.length === 0) return '';

            return `
                <div class="${clayCardClass} overflow-hidden">
                    <button data-action="toggle-lesson" data-id="${lesson.id}" class="w-full flex items-center justify-between p-4 sm:p-5 bg-slate-50/50 dark:bg-slate-800/80 hover:bg-slate-100/50 dark:hover:bg-slate-700/50 transition-colors text-left focus:outline-none">
                        <div class="flex items-center space-x-3">
                            <svg class="w-5 h-5 text-slate-400 transition-transform ${lesson.expanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

                        </div>
                        <span class="text-sm font-medium text-slate-500 bg-slate-200/50 dark:bg-slate-700 px-2.5 py-0.5 rounded-full">${qs.length}</span>
                    </button>
                    
                    <div class="${lesson.expanded ? 'block' : 'hidden'} border-t border-slate-100 dark:border-slate-700/50 p-4 sm:p-5 space-y-3">
                        ${qs.map((q, idx) => `
                            <details class="group bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden open:ring-1 open:ring-indigo-500/20 transition-all">
                                <summary class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-750 transition-colors list-none">
                                    <div class="flex items-start sm:items-center gap-3 overflow-hidden">
                                        <div class="shrink-0 flex items-center justify-center w-6 h-6 rounded bg-slate-100 dark:bg-slate-700 text-xs font-bold text-slate-500">${idx+1}</div>
                                        <div>
                                            <p class="font-medium text-slate-900 dark:text-white truncate max-w-[200px] sm:max-w-md lg:max-w-xl">${q.prompt}</p>
                                            <div class="flex flex-wrap gap-2 mt-1">
                                                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">${q.type.toUpperCase()}</span>${q.mastery === 'needs-review' ? '<span class="text-[10px] uppercase font-bold tracking-wider text-amber-500">Needs Review</span>' : ''}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex gap-2 shrink-0 self-end sm:self-auto">
                                        <button data-action="mock-practice" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 px-3 py-1.5 rounded-lg transition-colors border border-indigo-100 dark:border-indigo-800/50">Practice</button>
                                        <div class="h-6 border-r border-slate-200 dark:border-slate-700 mx-1"></div>
                                        <button data-action="open-modal" data-modal="editQuestion" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-1.5 rounded-lg transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                        <button data-action="open-modal" data-modal="deleteConfirm" class="text-slate-400 hover:text-red-500 p-1.5 rounded-lg transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                        <svg class="w-4 h-4 text-slate-400 ml-1 mt-1.5 transition-transform group-open:rotate-180 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
                                    </div>
                                </summary>
                                <div class="px-4 pb-5 pt-2 border-t border-slate-100 dark:border-slate-700/50 bg-slate-50/30 dark:bg-slate-800/30">
                                    <div class="space-y-4">
                                        <div>
                                            <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Answer</span>
                                            <p class="text-sm font-medium text-slate-800 dark:text-slate-200 bg-emerald-50/50 dark:bg-emerald-900/10 border border-emerald-100 dark:border-emerald-800/30 px-3 py-2 rounded-lg">${q.type === 'mcq' ? q.choices[q.correctAnswer] : q.correctAnswer}</p>
                                        </div>
                                        ${q.explanation ? `<div><span class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Explanation</span><p class="text-sm text-slate-600 dark:text-slate-300">${q.explanation}</p></div>` : ''}
                                    </div>
                                </div>
                            </details>
                        `).join('')}
                    </div>
                </div>
            `;
        }

                    </div>

        }

        function renderStudySessionView() {
            return `
                <div class="max-w-[800px] mx-auto space-y-8">
                    <div class="flex items-center justify-between">
                        <button data-nav="detail" class="text-sm font-medium text-slate-500 hover:text-slate-900 dark:hover:text-white">Exit Session</button>
                        <span class="text-sm font-bold text-indigo-600 dark:text-indigo-400">Question 1 of 5</span>

                    </div>

                    <div class="${clayCardClass} p-8 sm:p-12 space-y-8">

                        <div class="space-y-3">
                            <button class="w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-indigo-500 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/30 transition-all text-slate-800 dark:text-slate-200 font-medium">A. Alibata</button>
                            <button class="w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-indigo-500 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/30 transition-all text-slate-800 dark:text-slate-200 font-medium">B. Baybayin</button>
                            <button class="w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-indigo-500 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/30 transition-all text-slate-800 dark:text-slate-200 font-medium">C. Sanskrit</button>
                            <button class="w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-indigo-500 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/30 transition-all text-slate-800 dark:text-slate-200 font-medium">D. Cyrillic</button>
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <button data-nav="results" class="${primaryButtonClass} px-8">Next Question</button>

        function renderResultsView() {
            return `
                <div class="max-w-[720px] mx-auto text-center space-y-8 py-8">
                    <div class="w-24 h-24 rounded-full bg-emerald-50 dark:bg-emerald-900/30 text-emerald-500 flex items-center justify-center mx-auto shadow-sm">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <div class="space-y-2">
                        <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Session Complete!</h1>
                        <p class="text-slate-500 dark:text-slate-400">Great job reviewing Philippine History.</p>
                    </div>

                    <div class="grid grid-cols-3 gap-4">
                        <div class="${clayCardClass} p-5 text-center"><span class="block text-xs text-slate-400 mb-1">Score</span><span class="text-2xl font-bold text-slate-900 dark:text-white">85%</span></div>
                        <div class="${clayCardClass} p-5 text-center"><span class="block text-xs text-slate-400 mb-1">Correct</span><span class="text-2xl font-bold text-emerald-600">17/20</span></div>
                        <div class="${clayCardClass} p-5 text-center"><span class="block text-xs text-slate-400 mb-1">Time</span><span class="text-2xl font-bold text-slate-900 dark:text-white">4m 12s</span></div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
                        <button data-nav="library" class="${secondaryButtonClass}">Return to Library</button>
                        <button data-nav="study" class="${primaryButtonClass}">Study Again</button>
                    </div>

        function renderTrashView() {
            return `
                <div class="max-w-[1000px] mx-auto space-y-8">
                    <header class="mb-8">
                        <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white tracking-tight mb-2">Trash</h1>
                        <p class="text-slate-500 dark:text-slate-400">Recently deleted study sets.</p>
                    </header>
                    <div class="space-y-4">
                        ${state.trashSets.length === 0 ? '<p class="text-slate-400 text-center py-12">Trash is empty.</p>' : state.trashSets.map(t => `
                            <div class="${clayCardClass} p-5 flex items-center justify-between">
                                <div>
                                    <h3 class="font-semibold text-slate-900 dark:text-white">${t.title}</h3>
                                    <p class="text-xs text-slate-400">Deleted ${t.deletedDate} •${t.totalQuestions} items</p>
                                </div>
                                <button data-action="unimplemented" class="${secondaryButtonClass}">Restore</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderHelpView() {
            return `
                <div class="max-w-[800px] mx-auto space-y-8">
                    <header class="mb-8">
                        <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white tracking-tight mb-2">Help Center</h1>
                        <p class="text-slate-500 dark:text-slate-400">Frequently asked questions and guides.</p>
                    </header>
                    <div class="${clayCardClass} p-6 sm:p-8 space-y-6">
                        <div class="space-y-2">
                            <h3 class="font-bold text-slate-900 dark:text-white text-lg">How do I generate study sets with AI?</h3>
                            <p class="text-sm text-slate-600 dark:text-slate-400">Navigate to Create, select AI, upload your PDF, DOCX, or TXT file, and click Generate Study Quiz.</p>
                        </div>
                        <div class="space-y-2 border-t border-slate-100 dark:border-slate-700/60 pt-6">
                            <h3 class="font-bold text-slate-900 dark:text-white text-lg">Can I edit generated questions?</h3>
                            <p class="text-sm text-slate-600 dark:text-slate-400">Yes! Open any study set from your Library and inspect the Questions & Review section to edit or delete any item.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- EVENT DELEGATION SETUP ---
        function setupEventDelegation() {
            document.addEventListener('click', (e) => {
                const navBtn = e.target.closest('[data-nav]');
                const actionBtn = e.target.closest('[data-action]');
                
                if (navBtn) {
                    const view = navBtn.getAttribute('data-nav');
                    const id = navBtn.getAttribute('data-id');
                    const scroll = navBtn.getAttribute('data-scroll');
                    navigate(view, id, scroll);
                    return;
                }

                if (actionBtn) {
                    const action = actionBtn.getAttribute('data-action');
                    const val = actionBtn.getAttribute('data-val');
                    const id = actionBtn.getAttribute('data-id');
                    const modal = actionBtn.getAttribute('data-modal');

                    if (action === 'toggle-theme') {
                        state.theme = state.theme === 'dark' ? 'light' : 'dark';
                        document.documentElement.classList.toggle('dark', state.theme === 'dark');
                        localStorage.setItem('studyforge-theme', state.theme);
                        renderShell();
                    } else if (action === 'toggle-sidebar') {
                        state.sidebarExpanded = !state.sidebarExpanded;
                        renderShell();
                    } else if (action === 'toggle-menu') {
                        state.activeDropdown = state.activeDropdown === id ? null : id;
                        renderPage();
                    } else if (action === 'select-create-method') {
                        state.createMethod = val;
                        renderPage();
                    } else if (action === 'back-to-create') {
                        state.createMethod = null;
                        renderPage();
                    } else if (action === 'toggle-lesson') {
                        const set = state.studySets.find(s => s.id === state.activeSetId) || state.studySets[0];
                        const lesson = set.lessons.find(l => l.id === id);
                        if (lesson) lesson.expanded = !lesson.expanded;
                        renderPage();
                    } else if (action === 'set-filter') {
                        state.filterReview = val;
                        renderPage();
                    } else if (action === 'open-modal') {
                        openModal(modal);
                    } else if (action === 'close-modal') {
                        closeModal();
                    } else if (action === 'mock-select-file') {
                        state.selectedFile = { name: 'PH_History_101.pdf', size: '2.4 MB' };
                        renderPage();
                    } else if (action === 'mock-remove-file') {
                        state.selectedFile = null;
                        renderPage();
                    } else if (action === 'mock-add-card') {
                        showToast('Card added successfully!');
                    } else if (action === 'mock-delete') {
                        state.studySets = state.studySets.filter(s => s.id !== id);
                        showToast('Study set moved to trash.', 'info');
                        renderPage();
                    } else if (action === 'unimplemented') {
                        showToast('This feature is part of the prototype.', 'info');
                    }
                } else {
                    if (state.activeDropdown !== null) {
                        state.activeDropdown = null;
                        renderPage();
                    }
                }
            });
        }
    </script>
</body>
